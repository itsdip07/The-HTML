<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" novalidate>
        name : <input type="text" name="" id=" " pattern="[0-9]" title="enter only number"> <br>

        firstname : <input type="text" name="" id="" minlength="3" maxlength="15"> <br>

        age : <input type="number" name="" id="" min="18" max="60"> <br>

        nationality : <input type="text" name="" id="" value="INDIAN" readonly> <br>

        lastname : <input type="text" name="" id="" autofocus> <br>

        range : <input type="range" name="" id="" min="500" max="5000" step="500"> <br>

        PhoneNo : <input type="tel" name=" " id="" pattern="[0-9]{3}-0-9]{3}-0-9]{}" title="enter the no like xxx-xxx-xxxx" >
<br>
        password : <input type="password" name=" " id=" " pattern="[0-9 a-z A-Z] {8,}">

        <button type="submit">SUBMIT</button>
        <button type="submit" disabled>xXx</button>
</form>
</body>
</html>
